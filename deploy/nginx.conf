# ============================================================
# 电商智能系统 · Nginx 配置（前端静态资源 + /api 反向代理）
# 说明：
#   1) 前端打包产物：ecom-ui/dist（npm run build 生成）
#   2) 前端 axios baseURL = /api，本配置将 /api 前缀去掉后转发到后端 8888
#   3) Windows 用法：将 server {} 整段拷入 nginx/conf/nginx.conf 的 http {} 内，
#      或在本文件所在目录用 include 引入；root 路径按实际部署位置调整
#   4) Linux 用法：拷贝到 /etc/nginx/conf.d/ecom.conf
# ============================================================

server {
    listen       80;
    server_name  localhost;

    charset      utf-8;
    client_max_body_size 20m;          # 商品图片上传

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------- 前端静态资源（Vue 打包产物） ----------
    root   D:/webxiangmu/ecom/ecom-ui/dist;   # Linux 部署改为 /opt/ecom/dist
    index  index.html;

    # history 路由回退（vue-router createWebHistory）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 后端接口反向代理（去掉 /api 前缀） ----------
    location /api/ {
        proxy_pass         http://127.0.0.1:8888/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- （可选）MinIO 图片代理 ----------
    # 商品图片默认直连 http://localhost:9000（数据库存的是绝对地址）。
    # 如部署到其他主机访问，可打开以下代理并把数据库图片域名改为本机：
    # location /minio/ {
    #     proxy_pass http://127.0.0.1:9000/;
    # }

    # ---------- （可选）Swagger 文档 ----------
    # location /doc.html { proxy_pass http://127.0.0.1:8888/doc.html; }
}
