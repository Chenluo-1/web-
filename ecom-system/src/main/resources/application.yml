server:
  port: 8888

spring:
  application:
    name: ecom
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/ecom?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      username: root
      password: 123456
  redis:
    host: localhost
    port: 6379
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    # 日期统一 yyyy-MM-dd HH:mm:ss（前后端一致，优惠券有效期表单需要）
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  mvc:
    # springfox 2.9.2 与 Boot 2.5 的兼容配置（不配会启动报错）
    pathmatch:
      matching-strategy: ant_path_matcher

jwt:
  # JWT 签名密钥（正式部署请更换为随机串）
  key: ecom

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: cn.ecom.domain.pojo
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: http://localhost:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucketName: ecom
